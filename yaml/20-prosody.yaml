# per registrare nuovi utenti:
# kubectl exec -it deployment/prosody-deployment -- prosodyctl register <username> prosody.atmtc.eu <password>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prosody-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-default
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prosody-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prosody
  template:
    metadata:
      labels:
        app: prosody
      annotations:
        dns.custom/name: "prosody"
        dns.custom/zone: "atmtc.eu"
    spec:
      hostNetwork: true
      volumes:
        - name: prosody-data-volume
          persistentVolumeClaim:
            claimName: prosody-data-pvc
        - name: prosody-certs-volume
          hostPath:
            path: /etc/ssl/private
            type: Directory
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 60
      containers:
        - name: prosody
          image: alpine:latest
          ports:
            - name: c2s
              containerPort: 5222
            - name: http-upload
              containerPort: 5281
          volumeMounts:
            - name: prosody-data-volume
              mountPath: /data
            - name: prosody-certs-volume
              mountPath: /etc/ssl/private
              readOnly: true
          workingDir: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache prosody su-exec || exit 1

              mkdir -p /data/prosody_store
              mkdir -p /etc/prosody/certs

              cp /etc/ssl/private/atmtc.eu.pem /etc/prosody/certs/atmtc.eu.pem
              cp /etc/ssl/private/atmtc.eu.key /etc/prosody/certs/atmtc.eu.key
              chmod 400 /etc/prosody/certs/atmtc.eu.key

              cat <<'EOF' > /etc/prosody/prosody.cfg.lua
              data_path = "/data/prosody_store"
              daemonize = false
              log = { "*console" }

              ssl = {
                key = "/etc/prosody/certs/atmtc.eu.key";
                certificate = "/etc/prosody/certs/atmtc.eu.pem";
              }

              modules_enabled = {
                "saslauth";     -- RFC 4422: Autenticazione SASL login utente
                "tls";          -- RFC 6120: STARTTLS per connessioni client
                "roster";       -- RFC 6121: Gestione rubrica e sottoscrizioni
                "disco";        -- XEP-0030 Service Discovery
                "private";      -- XEP-0049 Private XML Storage
                "pep";          -- XEP-0163 Personal Eventing Protocol (storage privato per-user moderno, richiesto per OMEMO)
                "smacks";       -- XEP-0198 Stream Management
                "ping";         -- XEP-0199 XMPP Ping
                "carbons";      -- XEP-0280 Message Carbons (copia dei messaggi tra device dello stesso utente, necessario per multi-device)
                "mam";          -- XEP-0313 Message Archive Management (salvataggio message history lato server)
                "csi_simple";   -- XEP-0352 Client State Indication (client segnala stato background, invio traffico non urgente ritardato)
                "bookmarks";    -- XEP-0402 PEP Native Bookmarks
              }

              modules_disabled = { "s2s" }
              s2s_ports = {}

              c2s_require_encryption = true
              c2s_ports = { 5222 }
              https_ports = { 5281 }
              http_ports = {}

              allow_registration = false

              archive_expires_after = "90d"

              VirtualHost "prosody.atmtc.eu"

              Component "upload.prosody.atmtc.eu" "http_file_share"
                http_host = "prosody.atmtc.eu"
                http_file_share_size_limit = 1024*1024*1024      -- 1GiB
                http_file_share_daily_quota = 1024*1024*1024      -- 1GiB
                http_file_share_global_quota = 15*1024*1024*1024 -- 15 GiB
                http_file_share_expires_after = "30 days"

              Component "conference.prosody.atmtc.eu" "muc"
                restrict_room_creation = "local"
                modules_enabled = { "muc_mam" }
                muc_log_expires_after = "90d"
              EOF

              chown -R prosody:prosody /data /etc/prosody
              exec su-exec prosody prosody
