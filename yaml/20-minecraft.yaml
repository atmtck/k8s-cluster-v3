### per copiare i dati del mondo in caso ci sia un savefile esistente, applicare questo yaml, poi:
### scalare il deployment esistente a 0:
# kubectl scale deployment minecraft-deployment --replicas=0
### creare un pod temporaneo per il trasferimento dati:
# kubectl apply -f - <<EOF
# apiVersion: v1
# kind: Pod
# metadata:
#   name: data-loader
# spec:
#   volumes:
#     - name: data-loader-volume
#       persistentVolumeClaim:
#         claimName: minecraft-data-pvc
#   containers:
#     - name: data-loader
#       image: alpine:latest
#       command: ["sleep", "infinity"]
#       volumeMounts:
#         - name: data-loader-volume
#           mountPath: /data
# EOF
### copiare i dati nel pod temporaneo:
# kubectl cp defcon data-loader:/data/defcon
### entrare a bordo del container temporaneo se necessario per aggiustare i dati:
# kubectl exec -it data-loader -- /bin/sh
### cancellare il pod temporaneo e riportare il deployment a una replica:
# kubectl delete pod/data-loader
# kubectl scale deployment minecraft-deployment --replicas=1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-default
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-deployment
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
      annotations:
        dns.custom/name: "minecraft"
        dns.custom/zone: "atmtc.eu"
    spec:
      hostNetwork: true
      volumes:
        - name: minecraft-data-volume
          persistentVolumeClaim:
            claimName: minecraft-data-pvc
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: minecraft
          image: registry.fedoraproject.org/fedora-minimal:latest
          ports:
            - containerPort: 25565
          volumeMounts:
            - name: minecraft-data-volume
              mountPath: /data
          workingDir: /data
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          stdin: true
          tty: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              microdnf install -y --nodocs curl jq java-25-openjdk-headless
              microdnf clean all

              echo 'eula=true' > eula.txt

              cat <<'EOF' > whitelist.json
              [
                {"uuid": "ccae4ace-fe97-482a-aac5-0b3a43cd1a17", "name": "springymochi"},
                {"uuid": "80b09e72-cd80-4c2a-b923-6373710d269f", "name": "tap3o"},
                {"uuid": "a8a22344-3849-4467-bc8f-da9667e87214", "name": "marcochiodo"},
                {"uuid": "aff6536a-16e7-4297-979c-e590aafc6118", "name": "_IC3"}
              ]
              EOF

              cat <<'EOF' > ops.json
              [{
                "uuid": "40fe2335-d5c4-387a-a022-5e6327b213c3",
                "name": "_IC3",
                "level": 4,
                "bypassesPlayerLimit": true
              }]
              EOF

              cat <<'EOF' > server.properties
              motd=§c§lDEFCON SERVER §e§lV4 INAFFONDABILE§r | §b§oReplicato su K8s

              white-list=true
              enforce-whitelist=true

              enable-code-of-conduct=false
              enable-jmx-monitoring=false
              enable-query=false
              enable-rcon=false
              enable-status=true
              management-server-enabled=false

              allow-flight=true
              difficulty=hard
              gamemode=survival
              force-gamemode=true

              level-name=defcon
              level-seed=
              level-type=minecraft\:normal
              view-distance=16
              simulation-distance=12
              spawn-protection=1

              max-players=8
              online-mode=true
              hide-online-players=true
              pause-when-empty-seconds=60
              region-file-compression=lz4
              server-port=25565
              EOF

              META_URL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.latest.release as $r | .versions[] | select(.id == $r) | .url')
              curl -o server.jar $(curl -s "$META_URL" | jq -r '.downloads.server.url')

              exec java -Xms2G -Xmx2G -XX:+UseTransparentHugePages -jar server.jar nogui
