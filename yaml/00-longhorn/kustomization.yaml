apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/longhorn/longhorn/v1.12.1/deploy/longhorn.yaml
  - storageclass.yaml

patches:
  - target:
      kind: ConfigMap
      name: longhorn-default-setting
      namespace: longhorn-system
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: longhorn-default-setting
        namespace: longhorn-system
      data:
        default-setting.yaml: |
          node-down-pod-deletion-policy: delete-both-statefulset-and-deployment-pod

  - target:
      kind: Deployment
      name: longhorn-ui
      namespace: longhorn-system
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: longhorn-ui
        namespace: longhorn-system
      spec:
        replicas: 0
